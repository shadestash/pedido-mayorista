<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rechazar reclamación</title>
<style>
  body { margin:0; background:#f4f4f2; color:#222; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:21px; margin:6px 0 2px; }
  p.sub { color:#777; margin:0 0 14px; }
  section { background:#fff; border:1px solid #e3e3df; border-radius:12px; padding:16px; margin-top:14px; }
  label.ck { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid #f0f0ec; cursor:pointer; }
  label.ck:last-child { border-bottom:0; }
  label.t { display:block; font-size:13px; color:#444; margin:6px 0 4px; }
  textarea { width:100%; padding:11px; border:1px solid #e3e3df; border-radius:8px; font-size:15px; font-family:inherit; }
  textarea:focus { outline:2px solid #1a1a1a; }
  button { width:100%; margin-top:16px; background:#1a1a1a; color:#fff; border:0; padding:15px; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; }
  #msg { margin-top:12px; font-size:14px; min-height:20px; }
  .ok { color:#1f7a3d; font-weight:700; } .err { color:#b00020; }
</style>
</head>
<body>
<main>
  <div id="form">
    <h1>Rechazar la reclamación</h1>
    <p class="sub" id="cab">Elige los motivos y, si quieres, añade los tuyos. El cliente recibirá un correo cordial con ellos en lista. No se le acusa de nada.</p>
    <section>
      <label class="ck"><input type="checkbox" value="Las fotos muestran un desgaste propio del uso del producto."><span>Las fotos muestran un desgaste propio del uso</span></label>
      <label class="ck"><input type="checkbox" value="El daño que se aprecia no es compatible con un defecto de fabricación ni con el transporte."><span>El daño no es compatible con fabricación ni transporte</span></label>
      <label class="ck"><input type="checkbox" value="La reclamación llega fuera del plazo en el que podemos tramitarla."><span>Fuera de plazo</span></label>
      <label class="ck"><input type="checkbox" value="Nos falta información para poder valorar el caso."><span>Falta información para valorarlo</span></label>
    </section>
    <section>
      <label class="t" for="otros">Otros motivos o explicación (una idea por línea)</label>
      <textarea id="otros" rows="4" placeholder="Escribe o dicta aquí con el micrófono del teclado"></textarea>
      <label class="t" for="nota">Nota privada tuya (no se envía al cliente)</label>
      <textarea id="nota" rows="2" placeholder="Por ejemplo: parece muestra de expositor"></textarea>
    </section>
    <button id="enviar">Enviar el rechazo al cliente</button>
    <div id="msg"></div>
  </div>
  <div id="fin" style="display:none"><h1 class="ok">Hecho</h1><p id="finmsg"></p></div>
</main>
<script>
var WEBHOOK = "https://shade-stash-automatizacion-n8n.jpexyl.easypanel.host/webhook/reclamacion-rechazo";
var q = new URLSearchParams(location.search), $ = function (i) { return document.getElementById(i); };
$("enviar").addEventListener("click", function () {
  var btn = this, msg = $("msg"); msg.textContent = ""; msg.className = "";
  var motivos = Array.prototype.slice.call(document.querySelectorAll("input[type=checkbox]:checked")).map(function (c) { return c.value; });
  $("otros").value.split("\n").forEach(function (l) { if (l.trim().length > 2) { motivos.push(l.trim()); } });
  if (!motivos.length) { msg.textContent = "Elige o escribe al menos un motivo."; msg.className = "err"; return; }
  if (!q.get("id") || !q.get("t")) { msg.textContent = "Falta el enlace de la reclamación."; msg.className = "err"; return; }
  var fd = new FormData();
  fd.append("id", q.get("id")); fd.append("t", q.get("t")); fd.append("motivos", JSON.stringify(motivos)); fd.append("nota", $("nota").value.trim());
  btn.disabled = true; btn.textContent = "Enviando…";
  fetch(WEBHOOK, { method: "POST", body: fd }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.ok) { $("form").style.display = "none"; $("fin").style.display = "block"; $("finmsg").textContent = j.mensaje; }
    else { msg.textContent = j.mensaje || "No se ha podido enviar."; msg.className = "err"; btn.disabled = false; btn.textContent = "Enviar el rechazo al cliente"; }
  }).catch(function () { msg.textContent = "Error de conexión. Prueba otra vez."; msg.className = "err"; btn.disabled = false; btn.textContent = "Enviar el rechazo al cliente"; });
});
</script>
</body>
</html>
